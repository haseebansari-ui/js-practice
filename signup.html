<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cuprum:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="signup-container">

    <div class="signup-wrapper">

        <div class="signup-main">

            <form action="#" id="form">

                <!-- Name -->

                <div class="input-field-bx">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your name"
                        id="name"
                        onkeyup="validateName()"
                    />

                    <p id="err-name"></p>

                </div>


                <!-- Email -->

                <div class="input-field-bx">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="text"
                        placeholder="youremail@gmail.com"
                        id="email"
                        onkeyup="validateEmail()"
                    />

                    <p id="err-email"></p>

                </div>


                <!-- Phone -->

                <div class="input-field-bx">

                    <label for="phone">
                        Mobile no.
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your Mobile no."
                        id="phone"
                        onkeyup="validatePhone()"
                    />

                    <p id="err-phone"></p>

                </div>


                <!-- Password -->

                <div class="input-field-bx">

                    <label for="pass">
                        Password
                    </label>

                    <div class="pss-bx">
                        <input
                            type="password"
                            placeholder="Enter Password"
                            id="pass"
                            class="pass-input"
                            onkeyup="validatePassword()"
                        />

                        <div class="eye-icon-bx">
                            <span class="open-eye-icon"> <i class="ri-eye-line"></i> </span>
                            <span class="close-eye-icon"> <i class="ri-eye-off-line"></i> </span>

                        </div>
                    </div>    
                    <p id="err-pass"></p>

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>

        </div>

    </div>

</div> 

   <script src="js/script.js"></script>
</body>
</html>
